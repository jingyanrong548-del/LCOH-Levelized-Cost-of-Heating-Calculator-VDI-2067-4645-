# Optional: add inside a future lcoh.jingyanrong.com server block.
# Proxy may also use http://127.0.0.1:9107 directly (ENGINE_LCOH_BASE).
location = /calculate {
    proxy_pass http://127.0.0.1:9107/calculate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_read_timeout 60s;
}

location = /calculate/health {
    proxy_pass http://127.0.0.1:9107/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
